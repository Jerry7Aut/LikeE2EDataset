# <CASE_ID> —— 黑盒评测拓扑（模板）

# 出题人改：
#   name: <项目名>（与 case.env 的 COMPOSE_PROJECT 一致）
#   <target> 是业务外壳 + 漏洞载体（要自己写 target/Dockerfile）
#   ${TARGET_IMAGE:-<vul 镜像>} 让评测器能切 vul/patched
#   target 之外的 case 专属服务，image 前缀用 <项目名>/
#
# 公用组件（gateway / ndr / egress）不复制源码：构建上下文指向
# datasetLikeE2e/components/，镜像名是仓库级共享 tag。改组件只改那一份。
#
# 组织约定（三道现有 case 都按这个来，评测器也只依赖这些）：
#   * 服务名用语义裸名，**不加前缀**：target / gateway / egress / traffic / normal，
#     另有 case 专属业务组件按需（如 frontend、db）。
#   * **不写 container_name**。评测器所有容器内操作都走
#     `docker compose exec <service>`，只认服务名，容器名交给 compose 默认。
#   * **流量容器一律一次性**：`profiles: ["traffic"]`，由评测器
#     `docker compose run --rm <service> <命令>` 拉起，跑完即销毁。不要写常驻容器
#     （`while true; do sleep 3600; done`）—— 那是旧机制的残留，现在没有任何东西会去 exec 它。
#   * 网络固定七张，名字固定：entry_net / gateway_net / target_net / mgmt_net /
#     blue_net / agent_net / egress_out。
#
# 数据面（全部经同一共享出口，网关看到的真实源 IP 完全一致）：
#
#   traffic ───┼─> egress ──> gateway ──> target
#   normal ────┘
#
# 控制面：
#   宿主机评测器 ──> gateway 管理 API (:8080，仅回环)
#   蓝队 agent   ──blue_net──> NDR（检测读 /traffic，处置写 /rules）
#   NDR          ──gateway_net──> gateway 管理 API（规则下发）
#   NDR 同时接 mgmt_net：宿主机经回环端口读流量与告警（容器只在非 internal
#   网络上才发布端口，所以要有一张非 internal 网）
#
# 网络隔离（结构性约束，不依赖配置自觉）：
#   entry_net    流量角色所在；**只有** egress，解析不到网关与目标
#   gateway_net  仅 egress + gateway + ndr
#   target_net   仅 gateway + target；无宿主机端口，外部不可达
#   mgmt_net     gateway 管理面 + NDR；只给宿主机回环发布
#   blue_net     蓝队 + NDR（internal）；蓝队碰不到执行点
#
# 参考防御（blackbox/defense/）**没有容器**，只跑在宿主机；
# 它不得出现在本文件的任何 volumes 里。

name: <项目名>

services:
  # ── 业务外壳 + 漏洞载体（出题人写 target/Dockerfile）──
  target:
    build:
      context: ./<target>
    image: ${TARGET_IMAGE:-<项目名>/<target>:1}
    networks:
      - target_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "<探活：业务就绪判据>"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # ── 唯一策略执行点（数据面）+ 蓝队受控 API（管理面）；公用镜像 ──
  gateway:
    build:
      context: ../../../components/security_gateway
    image: datasetlikee2e/policy-gateway:1
    networks:
      gateway_net:
        ipv4_address: 172.31.0.3
      target_net:
        ipv4_address: 172.32.0.2
      mgmt_net:
        ipv4_address: 172.33.0.2
    restart: unless-stopped
    environment:
      GATEWAY_UPSTREAM_HOST: target
      GATEWAY_UPSTREAM_PORT: "80"
      GATEWAY_ADMIN_TOKEN: "${GATEWAY_ADMIN_TOKEN:-local-admin-token}"
      GATEWAY_S5_TOKEN: "${GATEWAY_S5_TOKEN:-local-s5-token}"
      GATEWAY_S6_TOKEN: "${GATEWAY_S6_TOKEN:-local-s6-token}"
      GATEWAY_NDR_URL: "http://ndr:8080"
      GATEWAY_NDR_INGEST_TOKEN: "${NDR_INGEST_TOKEN:-local-ndr-ingest}"
    ports:
      - "127.0.0.1:<端口>:8080"     # 管理面仅宿主机回环
    volumes:
      - gateway_data:/data
    depends_on:
      - target

  # ── 旁路 NDR：蓝队的观测与处置平台（公用镜像）──
  ndr:
    build:
      context: ../../../components/ndr
    image: datasetlikee2e/ndr:1
    networks:
      gateway_net:
        ipv4_address: 172.31.0.4
      mgmt_net:
        ipv4_address: 172.33.0.4
      blue_net:
    restart: unless-stopped
    environment:
      NDR_INGEST_TOKEN: "${NDR_INGEST_TOKEN:-local-ndr-ingest}"
      NDR_BLUE_TOKEN: "${NDR_BLUE_TOKEN:-local-ndr-blue}"
      NDR_RULE_TOKEN: "${NDR_RULE_TOKEN:-local-ndr-rule}"
      NDR_ADMIN_TOKEN: "${NDR_ADMIN_TOKEN:-local-ndr-admin}"
      GATEWAY_MGMT_URL: "http://gateway:8080"
      NDR_GATEWAY_TOKEN: "${GATEWAY_S6_TOKEN:-local-s6-token}"
    ports:
      - "127.0.0.1:<NDR端口>:8080"  # 仅宿主机回环：评测器读流量与告警
    depends_on:
      - gateway

  # ── 共享出口（公用镜像）──
  egress:
    build:
      context: ../../../components/transparent_proxy
    image: datasetlikee2e/transparent-proxy:1
    networks:
      gateway_net:
        ipv4_address: 172.31.0.2
      entry_net:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    environment:
      PROXY_ROLE: shared-egress
      LISTEN_PORT: "80"
      UPSTREAM_HOST: gateway
      UPSTREAM_PORT: "80"
      LOG_REQUESTS: "1"
    depends_on:
      - gateway

  # ── 流量容器（一次性）：重放攻击 / 业务回归的宿主，由评测器 run 起来 ──
  #    case.json 的 replay.attack_cmd / business.command 就是它的子命令
  traffic:
    build:
      context: ../../../components/runner
    image: datasetlikee2e/runner:1
    profiles: ["traffic"]
    networks:
      - entry_net
    volumes:
      - ./traffic:/work/traffic:ro
      - ./business_tests:/work/business_tests:ro
    working_dir: /work
    environment:
      GATEWAY_URL: "http://egress:80"

  # ── 正常业务流量（一次性）：业务基线与 S7 口径 ──
  normal:
    build:
      context: ../../../components/runner
    image: datasetlikee2e/runner:1
    profiles: ["traffic"]
    networks:
      - entry_net
    volumes:
      - ./traffic:/work/traffic:ro
    working_dir: /work
    environment:
      GATEWAY_URL: "http://egress:80"
    command: ["python", "-u", "traffic/normal_traffic.py", "--gateway", "http://egress:80"]

  # ── egress 代理（squid，agent 的模型出网口，通用）──
  egress_proxy:
    image: ubuntu/squid:5.2
    profiles: ["agent"]
    networks:
      - agent_net
      - egress_out
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

networks:
  # 入口网：红队 / 流量角色 / 黑盒攻击者 agent 都在此网。此网内**只有** egress，
  # 解析不到网关与目标，也不通公网。
  entry_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # 动态分配压到后半段，把 .2 留给 egress 的固定地址。
          # Docker 不会跳过已被静态占用的地址，不划范围就会 Address already in use。
          ip_range: 172.30.0.128/25
  gateway_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
          ip_range: 172.31.0.128/25
  target_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24
          ip_range: 172.32.0.128/25
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24
          ip_range: 172.33.0.128/25
  # 蓝队网（internal）：蓝队 agent 与 NDR 唯一相连的网
  blue_net:
    driver: bridge
    internal: true
  # agent 隔离网（internal，无外网）+ squid 出口网（有外网）
  agent_net:
    driver: bridge
    internal: true
  egress_out:
    driver: bridge

volumes:
  gateway_data:
